buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "github"
            url = "https://github.com/juanmuscaria/maven/raw/master"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle2:[2.3-1.0.0-SNAPSHOT,)'
    }
}

repositories {
	flatDir {
		dirs 'deps'
	}
}

apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'net.minecraftforge.gradle.forge'

version = mod_version
group = mod_group
archivesBaseName = mod_archives_name

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
	// Single-sourced from gradle.properties — see the ceiling note on forge_version there.
	version = "${mc_version}-${forge_version}"
    mappings = "stable_39"
	runDir = "eclipse"

	replace '@VERSION@', project.version
	replaceIn 'RLCraftDeathPenalty.java'
}

processResources {

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version,
		'mod_id': mod_id,
		'mod_name': mod_name,
		'mod_author': mod_author,
		'mod_description': mod_description,
		'mod_credits': mod_credits,
		'mod_url': mod_url,
		'mc_version': mc_version,
		'mod_version': mod_version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

dependencies {
	// Scaling Health is a hard runtime dependency — this mod does nothing without it.
	// compileOnly, never bundled: the released jar is not ours to redistribute.
	// The distributed jar keeps its own class/method names (only Minecraft's methods
	// are SRG-mapped inside it), so compiling against a release jar works fine here.
	compileOnly name: 'ScalingHealth-1.12.2-1.3.42'
	// Scaling Health's own Config class extends SilentLib's ConfigBaseNew, so javac needs
	// SilentLib on the classpath to resolve it — even though this mod never calls into
	// SilentLib itself. It ships as a hard dependency of Scaling Health, so it is always
	// present at runtime wherever Scaling Health is.
	compileOnly name: 'SilentLib-1.12.2-3.0.14'

	// Soft dependencies — the mod runs fine without either. Every call into them is
	// behind a Loader.isModLoaded check and isolated in its own compat class, so their
	// classes are never loaded when the mod is absent.
	compileOnly name: 'Baubles-1.12-1.5.2-dev'
	compileOnly name: 'WearableBackpacks-1.12.2-3.2.6'
}

task devJar(type: Jar) {
	classifier = 'dev'
	from sourceSets.main.output
}

task sourcesJar(type: Jar) {
	classifier = 'sources'
	from sourceSets.main.allSource
}

artifacts {
	archives devJar
	archives sourcesJar
}

// Dev convenience: copies the built jar straight into a local test instance so
// testing changes doesn't require a manual copy step. Opt-in and machine-local
// — set `deployDir` in your user gradle.properties (~/.gradle/gradle.properties),
// not here, so the build still works for anyone else who clones the repo.
def deployDir = project.findProperty('deployDir')

task deployToInstance(type: Copy) {
	onlyIf { deployDir && file(deployDir).isDirectory() }
	from jar.archivePath
	into deployDir ?: "$buildDir/deploy"
	rename { "RLCraftDeathPenalty-${project.version}.jar" }
}

deployToInstance.dependsOn reobfJar
build.finalizedBy deployToInstance
